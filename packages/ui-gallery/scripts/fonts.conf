<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font configuration for screenshot runs only: scripts/shots.mjs launches Chromium with
  FONTCONFIG_FILE pointing here. It is the system configuration plus the user font directory
  (~/.local/share/fonts, where MiSans-Light.ttf is installed by hand and never committed), with one
  rule: a sans-serif request lighter than regular resolves to MiSans, so a light fallback renders
  in a real light face instead of DejaVu or a synthetic thin CJK face.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="xdg">fonts</dir>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <test name="weight" compare="less">
      <const>regular</const>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>MiSans</string>
    </edit>
  </match>
</fontconfig>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>module tree</title>
    <!--
      The module-tree viewer. CI renders every commit's interface table as one self-contained
      page and uploads it as a workflow artifact (`ifaces-page-<sha>`, see .github/workflows/
      ci.yml); artifacts expire and never touch the repository, but they download only as a
      zip and only with a token. This page is the link the job summary and the PR comment
      carry: it fetches that zip through the artifact proxy, unpacks it in the browser and
      shows the page in a frame — one click from the run to the tree, nothing stored anywhere.

        /ifaces/?owner=<org>&repo=<name>&run=<run id>&artifact=<artifact id>

      `artifact` may be left off: the run's artifacts are listed and the `ifaces-page-*` one
      is taken. A zip downloaded by hand (the proxy refused, or the artifact expired and was
      kept) opens through the file picker. Static, built by nothing — it lives in the landing
      package's public/ so the Pages deploy carries it as-is.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1f2328;
        --muted: #6a737d;
        --line: #d0d7de;
        --bg: #fff;
        --panel: #f6f8fa;
        --accent: #0969da;
        --bad: #cf222e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e6edf3;
          --muted: #8b949e;
          --line: #30363d;
          --bg: #0d1117;
          --panel: #161b22;
          --accent: #58a6ff;
          --bad: #ff7b72;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font:
          13px/1.45 system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        align-items: baseline;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header strong {
        font-weight: 600;
      }
      header a {
        color: var(--accent);
        text-decoration: none;
      }
      .muted {
        color: var(--muted);
      }
      label.pick {
        margin-left: auto;
        color: var(--accent);
        cursor: pointer;
      }
      label.pick input {
        display: none;
      }
      #status {
        padding: 24px 16px;
        max-width: 720px;
      }
      #status.bad {
        color: var(--bad);
      }
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>module tree</strong>
      <span id="where" class="muted"></span>
      <a id="run" hidden>run</a>
      <a id="download" hidden>download zip</a>
      <label class="pick"
        >open a zip<input id="file" type="file" accept=".zip,application/zip"
      /></label>
    </header>
    <p id="status" class="muted"></p>
    <iframe id="page" hidden title="module tree"></iframe>
    <script>
      const PROXY = "https://github-artifacts.camiyoru.workers.dev/";
      const PREFIX = "ifaces-page-";
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const ref = {
        owner: params.get("owner") || "Prism-Shadow",
        repo: params.get("repo") || "penguin-harness",
        run: params.get("run") || "",
        artifact: params.get("artifact") || "",
      };

      const say = (text, bad) => {
        const el = $("status");
        el.hidden = false;
        el.className = bad ? "bad" : "muted";
        el.textContent = text;
      };

      // A zip reader, just enough for what upload-artifact writes: a flat central directory
      // of stored (0) or deflated (8) entries, no zip64. Deflate is the browser's own
      // DecompressionStream, so nothing is loaded.
      const u16 = (v, o) => v.getUint16(o, true);
      const u32 = (v, o) => v.getUint32(o, true);
      async function unzip(buffer) {
        const bytes = new Uint8Array(buffer);
        const v = new DataView(buffer);
        let eocd = -1;
        for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65558); i--) {
          if (u32(v, i) === 0x06054b50) {
            eocd = i;
            break;
          }
        }
        if (eocd < 0) throw new Error("not a zip file");
        const count = u16(v, eocd + 10);
        let p = u32(v, eocd + 16);
        const files = new Map();
        for (let n = 0; n < count; n++) {
          if (u32(v, p) !== 0x02014b50) throw new Error("zip central directory is damaged");
          const method = u16(v, p + 10);
          const size = u32(v, p + 20);
          const nameLen = u16(v, p + 28);
          const extraLen = u16(v, p + 30);
          const commentLen = u16(v, p + 32);
          const local = u32(v, p + 42);
          const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
          const dataAt = local + 30 + u16(v, local + 26) + u16(v, local + 28);
          const raw = bytes.subarray(dataAt, dataAt + size);
          let out;
          if (method === 0) out = raw;
          else if (method === 8)
            out = new Uint8Array(
              await new Response(
                new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw")),
              ).arrayBuffer(),
            );
          else throw new Error(`zip entry ${name} uses method ${method}`);
          files.set(name.replace(/^.*\//, ""), out);
          p += 46 + nameLen + extraLen + commentLen;
        }
        return files;
      }

      function show(files) {
        const html = files.get("index.html");
        const json = files.get("ifaces.json");
        if (!html) throw new Error("the zip has no index.html — not an ifaces-page artifact");
        let page = new TextDecoder().decode(html);
        if (json) {
          const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
          page = page.replace('href="ifaces.json"', `href="${url}" download="ifaces.json"`);
        }
        const frame = $("page");
        frame.srcdoc = page;
        frame.hidden = false;
        $("status").hidden = true;
        const title = /<title>([^<]*)<\/title>/.exec(page);
        if (title) document.title = title[1];
      }

      async function fromArtifact() {
        const api = `https://api.github.com/repos/${ref.owner}/${ref.repo}/actions`;
        $("where").textContent = `${ref.owner}/${ref.repo}`;
        if (ref.run) {
          const a = $("run");
          a.href = `https://github.com/${ref.owner}/${ref.repo}/actions/runs/${ref.run}`;
          a.hidden = false;
        }
        if (!ref.artifact) {
          if (!ref.run) {
            say("No run or artifact in the URL. Open a zip instead.");
            return;
          }
          say("Listing the run's artifacts…");
          const res = await fetch(`${api}/runs/${ref.run}/artifacts?per_page=100`);
          if (!res.ok) throw new Error(`GitHub refused the artifact list with HTTP ${res.status}`);
          const { artifacts } = await res.json();
          const mine = artifacts.find((x) => x.name.startsWith(PREFIX) && !x.expired);
          if (!mine)
            throw new Error("the run has no live ifaces-page artifact (they expire after 14 days)");
          ref.artifact = String(mine.id);
        }
        if (ref.run) {
          const d = $("download");
          d.href = `https://github.com/${ref.owner}/${ref.repo}/actions/runs/${ref.run}/artifacts/${ref.artifact}`;
          d.hidden = false;
        }
        say("Fetching the page…");
        const url = new URL(PROXY);
        url.searchParams.set("user", ref.owner);
        url.searchParams.set("repo", ref.repo);
        url.searchParams.set("artifactId", ref.artifact);
        const res = await fetch(url);
        if (!res.ok) {
          const text = (await res.text()).trim();
          if (res.status === 404 || res.status === 410)
            throw new Error("the artifact is gone — they expire 14 days after the run");
          throw new Error(
            `the artifact proxy answered HTTP ${res.status}${text ? `: ${text}` : ""}`,
          );
        }
        show(await unzip(await res.arrayBuffer()));
      }

      $("file").addEventListener("change", async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        try {
          say(`Opening ${f.name}…`);
          show(await unzip(await f.arrayBuffer()));
        } catch (err) {
          say(String(err.message || err), true);
        }
      });

      fromArtifact().catch((err) => {
        say(
          `${String(err.message || err).replace(/\.$/, "")}. Download the zip from the run and open it here.`,
          true,
        );
      });
    </script>
  </body>
</html>

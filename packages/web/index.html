<!doctype html>
<html lang="zh-CN" data-titlebar-area>
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: the soft keyboard shrinks the LAYOUT viewport, so the shell's
         `height: 100%` reflows above it instead of the page keeping its full height and
         letting the keyboard cover the bottom (the terminal's last rows, a composer).
         Chrome-only; Safari is covered by useVisualViewportHeight. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/penguin-logo.svg" />
    <title>PenguinHarness</title>
    <!-- Pre-paint theme: sets html.dark, data-theme, data-theme-base, data-accent and the root
         font size from the stored preferences before the first frame, so a dark page, or one in
         any theme but the base, never flashes the base and the first frame never renders at
         16px and reflows; links a cached imported pack's stylesheet during parsing, so it too
         paints from the first frame; and lays a stored custom background on the boot layer, so
         a reload never shows the bare page colour where the image will be. Must equal
         BOOT_SCRIPT in @prismshadow/penguin-ui/boot byte for byte (a test compares them). -->
    <!-- prettier-ignore -->
    <script>(function(){try{var d=document.documentElement,s=localStorage,m=s.getItem("penguin.theme");if(m==="dark"||(m!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))d.classList.add("dark");var t=s.getItem("penguin.themeId"),k=null,i,x;if(["modern","geek","github","doodle"].indexOf(t)<0){if(t!==null&&/^[a-z][a-z0-9-]{1,31}$/.test(t)){try{var q=JSON.parse(s.getItem("penguin.themePacks"));if(Array.isArray(q))for(i=0;i<q.length&&!k;i++){x=q[i];if(x&&typeof x==="object"&&x.id===t&&typeof x.api==="number"&&x.api<=1&&typeof x.v==="string"&&/^[0-9a-f]{8,64}$/.test(x.v))k=x}}catch(e){}}if(!k)t="modern"}d.dataset.theme=t;if(k?k.base!=="foundation":["modern","doodle"].indexOf(t)>=0)d.dataset.themeBase="modern";if(k){try{document.write('<link rel="stylesheet" data-theme-pack="'+t+'" href="/api/themes/'+t+'/files/index.css?v='+k.v+'">')}catch(e){}}var a=s.getItem("penguin.accent"),n=["forest","ocean","clay","plum","honey","slate","orange","phosphor","cyan","magenta","gold","cobalt","blue","green","violet","rose","amber","marker","ballpoint","grass","crayon","grape"].indexOf(a)>=0;if(!n&&k&&k.accent&&typeof k.accent==="object"&&Array.isArray(k.accent.presets)&&a!==null&&/^[a-z][a-z0-9-]{0,31}$/.test(a))for(i=0;i<k.accent.presets.length;i++){x=k.accent.presets[i];if(x&&typeof x==="object"&&x.id===a)n=true}if(n)d.dataset.accent=a;var l=s.getItem("penguin.fontLatin");if(["system","mona-sans","ibm-plex-sans","misans"].indexOf(l)>=0)d.dataset.fontLatin=l;var c=s.getItem("penguin.fontCjk");if(["system","noto-sans-sc","misans"].indexOf(c)>=0)d.dataset.fontCjk=c;var z=s.getItem("penguin.textSize"),g=null,o=-1;if(["xs","s","m","l","xl"].indexOf(z)<0){g=s.getItem("penguin.fontScale");o=["sm","md","lg"].indexOf(g);z=o<0?"m":["m","l","xl"][o]}d.style.fontSize={"xs":"14px","s":"15px","m":"16px","l":"18px","xl":"20px"}[z];if(g!==null){try{if(o>=0)s.setItem("penguin.textSize",z);s.removeItem("penguin.fontScale")}catch(e){}}var w=s.getItem("penguin.background.image");if(typeof w==="string"&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/]+=*$/.test(w)){var b=null;try{b=JSON.parse(s.getItem("penguin.background.settings"))}catch(e){}if(!b||typeof b!=="object")b={};var r=b.transparency;r=typeof r==="number"&&isFinite(r)?Math.min(100,Math.max(0,r)):80;var u=["cover","contain","tile","original"].indexOf(b.mode)<0?"cover":b.mode;var p=["left top","center top","right top","left center","center center","right center","left bottom","center bottom","right bottom"].indexOf(b.position)<0?"center center":b.position;var y=d.style;y.setProperty("--boot-wallpaper-image",'url("'+w+'")');y.setProperty("--boot-wallpaper-size",u==="tile"||u==="original"?"auto":u);y.setProperty("--boot-wallpaper-repeat",u==="tile"?"repeat":"no-repeat");y.setProperty("--boot-wallpaper-position",p);y.setProperty("--boot-wallpaper-opacity",String(1-r/100));d.dataset.bootWallpaper=""}}catch(e){}})()</script>
  </head>
  <body>
    <!-- The window's drag handle in the desktop app: a transparent strip over the title band,
         zero tall in a browser (styles.css). data-titlebar-area on <html> tells a desktop shell
         older than the page-drawn window controls that this page lays the band out itself; the
         current shell reads data-window-controls, which the app sets once it draws them. -->
    <div class="window-drag-strip" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

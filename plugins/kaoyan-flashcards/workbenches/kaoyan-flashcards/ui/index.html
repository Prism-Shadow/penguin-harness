<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="storage-bridge.js"></script>
    <script src="i18n.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1a73e8" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flashcards" id="appTitleMeta" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />

    <title>Kaoyan Flashcards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <div class="brand">
          <span class="logo" aria-hidden="true" data-i18n="app.logo">K</span
          ><span class="brand-name" data-i18n="app.name">Kaoyan Flashcards</span>
        </div>
        <div class="seg" role="tablist" aria-label="Views" data-i18n-aria-label="nav.views">
          <button
            class="seg-btn on"
            id="tabHome"
            role="tab"
            aria-selected="true"
            data-i18n="nav.home"
          >
            Home
          </button>
          <button
            class="seg-btn"
            id="tabDeck"
            role="tab"
            aria-selected="false"
            data-i18n="nav.decks"
          >
            Decks
          </button>
          <button
            class="seg-btn"
            id="tabQuiz"
            role="tab"
            aria-selected="false"
            data-i18n="nav.quiz"
          >
            Quiz
          </button>
          <button
            class="seg-btn"
            id="tabRead"
            role="tab"
            aria-selected="false"
            data-i18n="nav.read"
          >
            Recite
          </button>
        </div>
        <div class="nav-actions">
          <button
            class="icon-btn"
            id="btnImportTop"
            aria-label="Import material"
            data-i18n-aria-label="import.title"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btnFilter"
            aria-label="Filters and settings"
            aria-haspopup="dialog"
            data-i18n-aria-label="drawer.title"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            >
              <path d="M4 7h16M7 12h10M10 17h4" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btnTheme"
            aria-label="Toggle dark mode"
            data-i18n-aria-label="nav.theme"
          >
            <svg
              id="iconMoon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" />
            </svg>
            <svg
              id="iconSun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              hidden
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
              />
            </svg>
          </button>
          <button
            class="icon-btn lang-btn"
            id="btnLang"
            type="button"
            data-i18n="lang.switch"
            data-i18n-aria-label="lang.switchLabel"
            data-i18n-title="lang.switchLabel"
          ></button>
        </div>
      </div>
    </header>
    <p class="load-note" id="loadNote" role="status" hidden></p>

    <main class="wrap" id="homeView" hidden>
      <section class="hero">
        <div class="hero-head">
          <p class="hero-hi" id="heroHi"></p>
          <p class="hero-date" id="heroDate"></p>
        </div>
        <div class="hero-mid">
          <div class="ring" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
              <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
            </svg>
            <div class="ring-txt">
              <b id="goalDone">0</b
              ><span
                >/ <span id="goalTotal">30</span> <span data-i18n="home.ringUnit">cards</span></span
              >
            </div>
          </div>
          <div class="hero-side">
            <p class="hero-goal" id="goalMsg"></p>
            <button class="btn primary hero-btn" id="btnStartToday"></button>
          </div>
        </div>
        <div class="goal-chips" id="goalChips"></div>
      </section>

      <section
        class="tiles"
        id="homeTiles"
        aria-label="Study stats"
        data-i18n-aria-label="home.tiles"
      ></section>
      <section
        class="quick"
        id="homeQuick"
        aria-label="Shortcuts"
        data-i18n-aria-label="home.shortcuts"
      ></section>
      <section class="sect">
        <h2 data-i18n="home.progress">Progress by subject</h2>
        <div id="homeDecks"></div>
      </section>
    </main>

    <main class="wrap" id="deckView" hidden>
      <section class="stats-strip" id="statsStrip" aria-live="polite"></section>
      <div class="deck-acts">
        <button class="chip" id="btnContinue" data-i18n="home.resume">Resume</button>
        <button class="chip" id="btnWrongBook" data-i18n="scope.wrong">Mistakes</button>
        <button class="chip" id="btnDueToday" data-i18n="scope.due">Due today</button>
      </div>
      <div id="deckGroups"></div>
    </main>

    <main class="wrap" id="quizView">
      <div class="prog-meta" aria-live="polite">
        <span class="caption" id="chapterLabel"></span>
        <span class="mono" id="progCount">– / –</span>
        <span class="today" id="roundStat"></span>
        <span class="today" id="todayStat"></span>
      </div>
      <div
        class="bar"
        id="bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span id="barFill"></span>
      </div>
      <section id="cardArea" aria-label="Flashcard" data-i18n-aria-label="quiz.cardArea"></section>
      <p class="hint" id="kbdHint">
        <span class="kbd" data-i18n="hint.space">Space</span>
        <span data-i18n="hint.reveal">show answer</span> · <span class="kbd">←</span
        ><span class="kbd">→</span> <span data-i18n="hint.move">previous / next</span> ·
        <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span>
        <span data-i18n="hint.rate">rate</span> ·
        <span data-i18n="hint.swipe">swipe on a phone</span>
      </p>
    </main>

    <main class="wrap" id="readView" hidden>
      <div class="read-top">
        <select
          class="select"
          id="docSelect"
          aria-label="Choose a document"
          data-i18n-aria-label="read.choose"
        ></select>
        <button
          class="chip"
          id="btnVeil"
          aria-pressed="false"
          data-i18n="read.veil"
          data-i18n-title="read.veilTitle"
        >
          Hide marked
        </button>
      </div>
      <div class="prog-meta">
        <span class="caption" id="docMeta">—</span>
        <span class="mono" id="docProgress"></span>
      </div>
      <div class="bar"><span id="docBar"></span></div>
      <article
        class="doc"
        id="docBody"
        aria-label="Document"
        data-i18n-aria-label="read.body"
      ></article>
      <div class="read-actions">
        <button class="ghost" id="btnPresets" data-i18n="read.presets">Restore presets</button>
        <button class="ghost" id="btnClearMarks" data-i18n="read.clearMarks">Clear marks</button>
        <button class="ghost danger" id="btnDelDoc" data-i18n="read.delete">Delete</button>
      </div>
    </main>

    <div class="rate" id="rateBar">
      <div
        class="rate-inner"
        role="group"
        aria-label="How well you knew it"
        data-i18n-aria-label="rate.group"
      >
        <button
          class="step"
          id="btnPrev"
          aria-label="Previous card"
          data-i18n-aria-label="rate.prev"
          data-i18n-title="rate.prevTitle"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </button>
        <button id="rateAgain" disabled>
          <span class="dot d-again" aria-hidden="true"></span
          ><span data-i18n="rate.again">Again</span>
        </button>
        <button id="rateHard" disabled>
          <span class="dot d-hard" aria-hidden="true"></span><span data-i18n="rate.hard">Hard</span>
        </button>
        <button id="rateGood" disabled>
          <span class="dot d-good" aria-hidden="true"></span><span data-i18n="rate.good">Good</span>
        </button>
        <button
          class="step"
          id="btnNextCard"
          aria-label="Skip this card"
          data-i18n-aria-label="rate.skip"
          data-i18n-title="rate.nextTitle"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-label="Filters and settings"
      data-i18n-aria-label="drawer.title"
      aria-hidden="true"
    >
      <div class="drawer-head">
        <h2 data-i18n="drawer.title">Filters and settings</h2>
        <button
          class="icon-btn"
          id="btnCloseDrawer"
          aria-label="Close"
          data-i18n-aria-label="common.close"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="drawer-body">
        <section>
          <h3 data-i18n="drawer.decks">Decks</h3>
          <div class="chips" id="deckChips"></div>
        </section>
        <section>
          <h3 data-i18n="drawer.search">Search</h3>
          <input
            class="search"
            id="qInput"
            type="search"
            placeholder="Words in questions, options or explanations"
            data-i18n-placeholder="drawer.searchPlaceholder"
            autocomplete="off"
          />
          <div class="match-line" id="matchLine"></div>
        </section>
        <section id="srcSection">
          <h3 data-i18n="drawer.source">School / year</h3>
          <div class="chips" id="schoolChips"></div>
          <div class="chips" id="yearChips" style="margin-top: 7px"></div>
        </section>
        <section>
          <h3 data-i18n="drawer.chapters">Chapters</h3>
          <div class="chips" id="chapChips"></div>
        </section>
        <section>
          <h3 data-i18n="drawer.types">Question type</h3>
          <div class="chips" id="typeChips"></div>
        </section>
        <section>
          <h3 data-i18n="drawer.scope">Show</h3>
          <div class="chips" id="scopeChips"></div>
        </section>
        <section>
          <h3 data-i18n="drawer.order">Order</h3>
          <div class="chips" id="orderChips"></div>
        </section>
        <section>
          <h3 data-i18n="drawer.data">Data</h3>
          <button class="ghost" id="btnImport" data-i18n="drawer.importDoc">
            Import PDF / Word / text
          </button>
          <input type="file" id="fileCards" accept="application/json,.json" hidden />
          <button class="ghost" id="btnImportCards" data-i18n="drawer.importCards">
            Import cards (JSON)
          </button>
          <input type="file" id="fileBackup" accept="application/json,.json" hidden />
          <button class="ghost" id="btnBackup" data-i18n="drawer.backup">Export study data</button>
          <button class="ghost" id="btnRestore" data-i18n="drawer.restore">
            Restore study data
          </button>
          <button class="ghost danger" id="btnReset" data-i18n="drawer.reset">
            Clear progress
          </button>
        </section>
      </div>
    </aside>

    <div class="modal" id="importModal" hidden>
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-label="Import material"
        data-i18n-aria-label="import.title"
      >
        <div class="modal-head">
          <h2 data-i18n="import.title">Import material</h2>
          <button
            class="icon-btn"
            id="btnCloseImport"
            aria-label="Close"
            data-i18n-aria-label="common.close"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <p class="caption" style="margin: 0" data-i18n="import.intro"></p>

        <div class="drop" id="dropZone">
          <div class="drop-row">
            <button class="btn" id="btnPickFile" data-i18n="import.pick">Choose file</button>
            <button class="btn" id="btnSample" data-i18n="import.sample">Try the sample</button>
            <span class="file-name" id="fileName"></span>
          </div>
          <p class="drop-hint" id="dropHint" data-i18n="import.dropHint"></p>
        </div>
        <input
          type="file"
          id="fileDoc"
          accept=".docx,.pdf,.txt,.md,application/pdf,text/plain"
          hidden
        />

        <textarea id="pasteArea" data-i18n-placeholder="import.pastePlaceholder"></textarea>

        <div class="preview" id="importPreview" hidden>
          <label for="docTitle" data-i18n="import.docTitle">Title</label>
          <input type="text" id="docTitle" value="" />
          <div class="pv-line" id="countLine"></div>
          <div class="pv-kinds" id="kindLine"></div>
          <div class="pv-list" id="pvList"></div>
          <label
            ><input type="checkbox" id="chkCards" checked /> <span id="cardsLabel"></span
          ></label>
          <label><input type="checkbox" id="chkDoc" checked /> <span id="docLabel"></span></label>
          <label for="importTarget" id="targetLabel" data-i18n="import.target"
            >Add questions to</label
          >
          <select class="select" id="importTarget"></select>
        </div>

        <div class="row" style="justify-content: flex-end">
          <button class="btn" id="btnResetImport" data-i18n="import.clear">Clear</button>
          <button class="btn primary" id="btnDoImport" disabled data-i18n="import.do">
            Import
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>

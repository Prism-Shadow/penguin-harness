<!doctype html>
<!--
  The pet widget's document: the iframe the web app docks for the `WebModule.widgets`
  contribution. The dock draws it bare — no card, no title bar, no background — and covers
  the whole window with it, so the whale has the page for a stage: she walks about it, stands
  where you drop her, and the document answers where the pointer is over her; the dock's tile
  is the only chrome. The frame is mounted when the app settles, before the tile is pressed,
  and kept hidden until then (the dock says `{ penguin: "widget-shown", shown }`): opening her
  is meant to show her, not to fetch a figure pack and build it.
  The URL carries `?v=<stamp>` — the version of this package's `ui/` files, put there by the
  server (plugin/package.ts) — so this document and everything it loads beside itself stay in
  the browser's cache between opens, while an edit under `ui/` moves the stamp and the URL with
  it (widget.js passes the same query to the pack's textures and to the dialog's bundle).
  Same-origin with the server, so it reads and writes the pet's state through
  the plugin state routes with the user's own cookie — GET to look, PATCH to move it.
  The pet herself is the DeepSeek whale (大肥鱼) figure pack drawn by the Coopanion kit
  (./figure/): a WebGL sprite rig the kit's body simulation walks, sits, sleeps, is picked
  up and answered by touch. This document holds the stage element, the speech bubble and an
  empty mount point for her dialog; everything else the kit and the figure draw.
  Her dialog (#panel, built from ./src by `pnpm build:ui` into ./dist, loaded on the first
  right-click) is where food is bought with the coins Token usage earns, where the daily签到
  and the daily Token graph live, and where she is told how often to talk and how much of the
  page she may roam. It is drawn with the shared UI package (@prismshadow/penguin-ui), so it
  carries the app's theme; the widget's own parts stay plain CSS because they are a game HUD,
  not chrome.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pet</title>
    <style>
      /* The dock declares the same scheme on the frame's element. When the two disagree the browser
     paints the frame as an opaque canvas instead of letting the page show through it — white over
     a dark page, which is what a "transparent" widget looks like without this line. The theme
     sheet the dialog loads sets the same scheme again for the same reason (src/panel.css). */
      :root {
        color-scheme: only light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: transparent;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #3a3330;
        overflow: hidden;
        user-select: none;
      }
      /* The dialog is text someone may want to read and copy, unlike her stage. */
      #panel {
        user-select: text;
      }
      #root {
        position: absolute;
        inset: 0;
        touch-action: none;
        cursor: grab;
      }
      #root:active {
        cursor: grabbing;
      }
      #bubble {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -100%);
        max-width: 230px;
        padding: 6px 10px;
        background: #fff;
        border: 1.5px solid #b9c7d8;
        border-radius: 10px;
        font-size: 12px;
        box-shadow: 0 2px 6px rgb(0 0 0 / 12%);
        pointer-events: none;
        white-space: pre-wrap;
        display: none;
      }
      #bubble::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 50%;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        background: #fff;
        border-right: 1.5px solid #b9c7d8;
        border-bottom: 1.5px solid #b9c7d8;
        transform: rotate(45deg);
      }
      .err {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #a55;
        font-size: 12px;
        padding: 12px;
        text-align: center;
      }
      /* Her balloon is the one thing this document paints itself, and it is up long before the
         sheet that carries the theme's tokens is ever loaded — so it spells the app's mode in two
         rules of its own, and widget.js keeps `dark` on <html> from the same store the Web App
         writes. (The sheet's own tokens would be a third source of truth for one small box.) */
      :root.dark #bubble {
        background: #262729;
        border-color: rgb(255 255 255 / 0.16);
        color: #e4e4e5;
        box-shadow: 0 2px 10px rgb(0 0 0 / 45%);
      }
      :root.dark #bubble::after {
        background: #262729;
        border-color: rgb(255 255 255 / 0.16);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="bubble"></div>
    <div id="panel"></div>
    <script type="module" src="./widget.js"></script>
  </body>
</html>

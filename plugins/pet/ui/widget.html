<!doctype html>
<!--
  The pet widget's document: the iframe the web app docks for the `WebModule.widgets`
  contribution. The dock draws it bare — no card, no title bar, no background — and covers the
  whole window with it, so the whale has the page for a stage: she walks about it, stands where
  you drop her, and the document answers where the pointer is over her; the dock's tile is the
  only control.
  Same-origin with the server, so it reads and writes the pet's state through
  the plugin state routes with the user's own cookie — GET to look, PATCH to move it.
  The pet herself is the DeepSeek whale (大肥鱼) figure pack drawn by the Coopanion kit
  (./figure/): a WebGL sprite rig the kit's body simulation walks, sits, sleeps, is picked
  up and answered by touch. The document holds only the stage element and the speech
  bubble; everything else the kit and the figure draw.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pet</title>
<style>
  /* The dock declares the same scheme on the frame's element. When the two disagree the browser
     paints the frame as an opaque canvas instead of letting the page show through it — white over
     a dark page, which is what a "transparent" widget looks like without this line. */
  :root { color-scheme: only light; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: transparent;
    font: 13px/1.4 system-ui, sans-serif;
    color: #3a3330;
    overflow: hidden;
    user-select: none;
  }
  #root { position: absolute; inset: 0; touch-action: none; cursor: grab; }
  #root:active { cursor: grabbing; }
  #bubble {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -100%);
    max-width: 230px;
    padding: 6px 10px;
    background: #fff;
    border: 1.5px solid #b9c7d8;
    border-radius: 10px;
    font-size: 12px;
    box-shadow: 0 2px 6px rgb(0 0 0 / 12%);
    pointer-events: none;
    white-space: pre-wrap;
    display: none;
  }
  #bubble::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 50%;
    width: 8px;
    height: 8px;
    margin-left: -4px;
    background: #fff;
    border-right: 1.5px solid #b9c7d8;
    border-bottom: 1.5px solid #b9c7d8;
    transform: rotate(45deg);
  }
  .err { position: absolute; inset: 0; display: grid; place-items: center; color: #a55; font-size: 12px; padding: 12px; text-align: center; }
</style>
</head>
<body>
  <div id="root"></div>
  <div id="bubble"></div>
  <script type="module" src="./widget.js"></script>
</body>
</html>

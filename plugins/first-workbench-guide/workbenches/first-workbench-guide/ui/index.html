<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your first workbench</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="intro"></p>
      <section>
        <h2 id="model-title"></h2>
        <p id="model"></p>
        <div class="actions"><button id="settings"></button><button id="choose"></button></div>
      </section>
      <section>
        <h2 id="chat-title"></h2>
        <form id="chat-form">
          <label for="request"></label
          ><textarea id="request" maxlength="4000" rows="3" required></textarea
          ><button id="send"></button>
        </form>
        <p id="answer"></p>
      </section>
      <section id="design-section" hidden>
        <h2 id="design-title"></h2>
        <form id="design-form">
          <label for="feedback"></label><textarea rows="2" id="feedback" maxlength="2000"></textarea
          ><button id="generate"></button>
        </form>
        <div id="preview"></div>
      </section>
      <section id="install-section" hidden>
        <h2 id="install-title"></h2>
        <p id="install-info"></p>
        <div class="actions">
          <button id="install"></button><a download id="export"></a><button id="test"></button
          ><a id="open" target="_blank" rel="noopener" hidden></a>
        </div>
      </section>
      <p role="status" id="status"></p>
      <button class="secondary" id="retry-read" hidden></button>
      <button class="secondary" id="restart" hidden></button>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>

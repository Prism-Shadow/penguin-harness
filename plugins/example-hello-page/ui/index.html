<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World</title>
    <!--
      Styled only with the host's theme tokens: the app injects /workflow-ui.css into this
      frame and copies its resolved colours, font and size onto this document's root, so the
      page follows light/dark and the accent without knowing either.
    -->
    <style>
      body {
        margin: 0;
        padding: 2rem;
      }
      #greeting {
        font-size: 1.5rem;
        color: var(--wf-fg);
      }
    </style>
  </head>
  <body>
    <h1>Example plugin page</h1>
    <p>This page is shipped by a plugin and drawn in the app's content area.</p>
    <button id="hello" class="wf-primary" type="button">Say hello</button>
    <p id="greeting" role="status" aria-live="polite"></p>
    <script src="hello.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta
      name="description"
      content="English Learning Workbench: read classics aloud word by word, news and TED guides, close reading of pasted articles, a daily press feed, a word and sentence library with review, shadowing and exam practice."
    />
    <title>English Learning Workbench</title>
    <link rel="stylesheet" href="styles.css?v=20261117" />
    <script src="i18n.js?v=20261117"></script>
  </head>
  <body>
    <div class="app">
      <aside class="side" aria-label="Main navigation" data-i18n-aria-label="nav.main">
        <a
          class="brand"
          href="#/today"
          aria-label="English Learning Workbench home"
          data-i18n-aria-label="brand.home"
        >
          <span class="mark" aria-hidden="true">E</span
          ><b data-i18n="app.name">English Learning Workbench</b>
        </a>
        <nav class="nav" id="nav">
          <a href="#/today" data-nav="today"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" /></svg
            ><span data-i18n="nav.today">Today</span></a
          >
          <a href="#/press" data-nav="press"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h11v14H4z" />
              <path d="M15 9h5v8a2 2 0 0 1-2 2h-3" />
              <path d="M7 8h5M7 11h5M7 14h4" /></svg
            ><span data-i18n="nav.press">Daily press</span></a
          >
          <a href="#/news" data-nav="news"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h11l3 3v13H5z" />
              <path d="M8 9h7M8 13h7M8 17h4" /></svg
            ><span data-i18n="nav.news">News reading</span></a
          >
          <a href="#/ted" data-nav="ted"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M10 9l5 3-5 3z" /></svg
            ><span data-i18n="nav.ted">TED talks</span></a
          >
          <a href="#/books" data-nav="books"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z" />
              <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5" /></svg
            ><span data-i18n="nav.books">Classics</span></a
          >
          <a href="#/media" data-nav="media"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9a3 3 0 0 1 3 3v4a3 3 0 0 1-6 0v-4" />
              <rect x="10" y="7" width="8" height="10" rx="2" />
              <path d="M18 10a4 4 0 0 1 0 4" /></svg
            ><span data-i18n="nav.media">Vlogs &amp; podcasts</span></a
          >
          <a href="#/wechat" data-nav="wechat"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H9l-4 3v-3a3 3 0 0 1-1-2.2z"
              />
              <path d="M8 9h8M8 12h5" /></svg
            ><span data-i18n="nav.wechat">WeChat accounts</span></a
          >
          <a href="#/exams" data-nav="exams"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 4h8l4 4v12H4V4z" />
              <path d="M9 12l2 2 4-4" /></svg
            ><span data-i18n="nav.exams">Exam practice</span></a
          >
          <a href="#/words" data-nav="words"
            ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" /></svg
            ><span data-i18n="nav.words">My library</span></a
          >
          <span class="sep" aria-hidden="true"></span>
          <a href="#/resources" data-nav="resources"
            ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg
            ><span data-i18n="nav.resources">Resources</span></a
          >
          <a href="#/settings" data-nav="settings"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M4.2 16.5l2.6-1.5M17.2 9l2.6-1.5"
              /></svg
            ><span data-i18n="nav.settings">Settings</span></a
          >
        </nav>
        <div class="side-foot">
          <div class="level">
            <span class="badge" id="sideLevel">L2</span><span id="sideLevelName"></span>
          </div>
          <div id="sideStreak"></div>
          <div id="sideSync" data-i18n="side.loading">Reading your record…</div>
          <div>
            <span data-i18n="side.updated">Content updated</span> <span id="sideUpdated">—</span>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <h1 id="pageTitle"></h1>
          <div class="right">
            <span class="pill accent" id="topMinutes"></span>
            <button
              class="iconbtn lang-btn"
              id="langBtn"
              type="button"
              data-i18n="lang.switch"
              data-i18n-aria-label="lang.switchLabel"
              data-i18n-title="lang.switchLabel"
            >
              中文
            </button>
            <button
              class="iconbtn"
              id="themeBtn"
              type="button"
              aria-label="Toggle dark mode"
              title="Toggle dark mode"
              data-i18n-aria-label="theme.toggle"
              data-i18n-title="theme.toggle"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8z" />
              </svg>
            </button>
            <a
              class="iconbtn"
              href="#/settings"
              aria-label="Settings"
              title="Settings"
              data-i18n-aria-label="nav.settings"
              data-i18n-title="nav.settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M4.2 16.5l2.6-1.5M17.2 9l2.6-1.5"
                />
              </svg>
            </a>
          </div>
        </header>

        <main class="wrap" id="view" tabindex="-1"></main>
      </div>
    </div>

    <nav class="tabbar" aria-label="Bottom navigation" data-i18n-aria-label="tab.label">
      <a href="#/today" data-nav="today"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" /></svg
        ><span data-i18n="tab.today">Today</span></a
      >
      <a href="#/press" data-nav="press"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h11v14H4z" />
          <path d="M15 9h5v8a2 2 0 0 1-2 2h-3" /></svg
        ><span data-i18n="tab.press">Press</span></a
      >
      <a href="#/news" data-nav="news"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h11l3 3v13H5z" />
          <path d="M8 9h7M8 13h7M8 17h4" /></svg
        ><span data-i18n="tab.news">News</span></a
      >
      <a href="#/words" data-nav="words"
        ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" /></svg
        ><span data-i18n="tab.words">Library</span></a
      >
      <a href="#/more" data-nav="more"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="1.4" />
          <circle cx="12" cy="12" r="1.4" />
          <circle cx="19" cy="12" r="1.4" /></svg
        ><span data-i18n="tab.more">More</span></a
      >
    </nav>

    <div
      class="rdbar"
      id="rdbar"
      hidden
      aria-label="Read-aloud controls"
      data-i18n-aria-label="rd.label"
    >
      <button
        class="iconbtn"
        id="ttsPause"
        type="button"
        aria-label="Pause or resume reading"
        title="Pause / resume"
        data-i18n-aria-label="rd.pause"
        data-i18n-title="rd.pauseTitle"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" /></svg>
      </button>
      <button
        class="iconbtn"
        id="ttsStop"
        type="button"
        aria-label="Stop reading"
        title="Stop"
        data-i18n-aria-label="rd.stop"
        data-i18n-title="rd.stopTitle"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="1.5" />
        </svg>
      </button>
      <span class="status" id="ttsStatus" data-i18n="tts.idle"
        >Click a word or a sentence to hear it</span
      >
      <label class="faint" for="rateRange" data-i18n="rd.rate">Speed</label>
      <input
        id="rateRange"
        type="range"
        min="0.7"
        max="1.2"
        step="0.05"
        value="1"
        aria-label="Reading speed"
        data-i18n-aria-label="rd.rateLabel"
      />
      <button
        class="chip"
        id="accentBtn"
        type="button"
        aria-label="Switch between US and UK accent"
        data-i18n-aria-label="rd.accentLabel"
      >
        US
      </button>
      <button
        class="chip"
        id="recBtn"
        type="button"
        aria-label="Record yourself"
        data-i18n="rd.rec"
        data-i18n-aria-label="rd.recLabel"
      >
        Shadow
      </button>
      <audio id="recAudio" controls hidden style="height: 28px; max-width: 180px"></audio>
    </div>

    <div
      class="pop"
      id="pop"
      role="dialog"
      aria-label="Word details"
      data-i18n-aria-label="pop.label"
    ></div>
    <div class="selbar" id="selbar">
      <button type="button" data-act="speak" data-i18n="sel.speak">Read</button>
      <button type="button" data-act="slow" data-i18n="sel.slow">Slow</button>
      <button type="button" data-act="save" data-i18n="sel.save">Save</button>
      <button type="button" data-act="copy" data-i18n="sel.copy">Copy</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="content.js?v=20261117"></script>
    <script src="app.js?v=20261117"></script>
  </body>
</html>

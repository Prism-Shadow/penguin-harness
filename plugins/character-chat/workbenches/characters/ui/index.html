<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>Character Post</title>
    <link rel="stylesheet" href="/workbench-ui.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main id="app" class="cc">
      <header class="cc-mast">
        <div class="cc-brand">
          <img src="./icon.svg" alt="" />
          <h1 data-copy="brand"></h1>
        </div>
        <div class="cc-tools">
          <button id="open-roster" class="cc-tool mobile-only" type="button"></button>
          <button id="open-settings" class="cc-tool" type="button"></button>
        </div>
      </header>
      <p id="unsupported" class="cc-banner" role="alert" hidden></p>
      <div class="cc-spread">
        <section class="cc-cast" aria-labelledby="who-name">
          <div class="cc-postcard" id="stage">
            <div id="scene" class="cc-scene" aria-hidden="true"></div>
            <div id="portrait" class="cc-portrait" role="img"></div>
            <div class="cc-place"><span id="pin"></span><span id="place"></span></div>
            <div class="cc-caption">
              <div>
                <h2 id="who-name"></h2>
                <p id="who-tagline"></p>
              </div>
              <button id="open-card" class="cc-tool" type="button"></button>
            </div>
          </div>
          <div id="shelf" class="cc-shelf">
            <div class="cc-shelf-head">
              <h2 data-copy="roster"></h2>
              <button id="add" class="cc-tool" type="button"></button>
            </div>
            <ul id="roster" class="cc-roster-list"></ul>
          </div>
        </section>
        <section class="cc-chat" aria-labelledby="chat-title">
          <header class="cc-chat-head">
            <div>
              <h2 id="chat-title"></h2>
              <div id="bond" class="cc-bond" tabindex="0">
                <span id="bond-mark"></span><span id="bond-level"></span
                ><span class="cc-bond-bar"><span id="bond-fill"></span></span>
              </div>
            </div>
            <div class="cc-tools">
              <button id="open-memory" type="button" class="cc-tool"></button
              ><button id="chapter" type="button" class="cc-icon"></button>
            </div>
          </header>
          <div id="transcript" class="cc-transcript" tabindex="0" aria-labelledby="chat-title">
            <div id="history"></div>
            <div id="live-turn" hidden></div>
            <p id="stage-note" class="cc-stage-note" role="status" hidden></p>
            <div id="topics" class="cc-topics"></div>
          </div>
          <span id="announcement" class="cc-sr-only" role="status"></span>
          <footer class="cc-compose">
            <div id="choices" class="cc-choices"></div>
            <form id="say" class="cc-say">
              <textarea id="say-text" rows="1" maxlength="4000"></textarea>
              <div class="cc-compose-actions">
                <button id="aloud" type="button" class="cc-icon" aria-pressed="false"></button
                ><button id="send" type="submit" class="cc-send"></button>
              </div>
            </form>
            <p class="cc-foot" data-copy="footer"></p>
          </footer>
        </section>
      </div>
      <dialog class="cc-sheet" id="sheet" aria-labelledby="sheet-title">
        <header class="cc-sheet-head">
          <h2 id="sheet-title"></h2>
          <button id="sheet-close" type="button" class="cc-icon" autofocus></button>
        </header>
        <div id="sheet-body" class="cc-sheet-body"></div>
        <div id="settings-fields" class="cc-sheet-body" hidden>
          <label class="cc-field"
            ><span data-copy="yourName"></span
            ><input id="user-name" type="text" maxlength="40" autocomplete="off"
          /></label>
          <label class="cc-field"
            ><span data-copy="language"></span
            ><select id="locale">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select></label
          >
        </div>
      </dialog>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Character Chat</title>
    <link rel="stylesheet" href="/workbench-ui.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div id="app" class="cc" data-sheet="none">
      <aside class="cc-roster" aria-labelledby="cc-title">
        <h1 id="cc-title" data-copy="title"></h1>
        <ul id="roster" class="cc-roster-list"></ul>
        <button id="add" type="button" class="cc-add"></button>
        <div class="cc-prefs">
          <label class="cc-field">
            <span data-copy="yourName"></span>
            <input id="user-name" type="text" maxlength="40" autocomplete="off" />
          </label>
          <div class="cc-prefs-row">
            <select id="locale" data-label="language">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
            <button id="aloud" type="button" class="cc-icon" aria-pressed="false"></button>
          </div>
        </div>
      </aside>

      <main class="cc-stage" id="stage">
        <div id="scene" class="cc-scene"></div>
        <p id="unsupported" class="cc-banner" role="alert" hidden></p>
        <header class="cc-plate">
          <div class="cc-who">
            <strong id="who-name"></strong>
            <span id="ai-chip" class="cc-chip" data-copy="aiChip"></span>
            <span id="who-tagline" class="cc-tagline"></span>
          </div>
          <div class="cc-tools">
            <div id="bond" class="cc-bond" tabindex="0">
              <span id="bond-mark" class="cc-bond-mark"></span>
              <span id="bond-level"></span>
              <span class="cc-bond-bar" aria-hidden="true"><span id="bond-fill"></span></span>
            </div>
            <button id="open-history" type="button" class="cc-icon"></button>
            <button id="open-memory" type="button" class="cc-icon"></button>
            <button id="open-card" type="button" class="cc-icon"></button>
            <button id="chapter" type="button" class="cc-icon"></button>
          </div>
        </header>
        <div id="portrait" class="cc-portrait" role="img"></div>
        <section class="cc-dialogue">
          <p id="said" class="cc-said" data-empty="1"></p>
          <div class="cc-box">
            <span id="speaker" class="cc-speaker"></span>
            <div id="line" class="cc-line" aria-live="polite"></div>
            <p id="stage-note" class="cc-stage-note" hidden></p>
          </div>
          <div id="choices" class="cc-choices"></div>
          <form id="say" class="cc-say">
            <textarea id="say-text" rows="1" maxlength="4000"></textarea>
            <button id="send" type="submit" class="cc-send"></button>
          </form>
          <p class="cc-foot" data-copy="footer"></p>
        </section>
      </main>

      <aside class="cc-sheet" id="sheet" hidden>
        <header class="cc-sheet-head">
          <h2 id="sheet-title"></h2>
          <button id="sheet-close" type="button" class="cc-icon"></button>
        </header>
        <div id="sheet-body" class="cc-sheet-body"></div>
      </aside>
    </div>
  </body>
</html>

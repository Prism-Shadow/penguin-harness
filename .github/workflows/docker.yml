# Docker: build the official image from this repository's source and publish it to Docker Hub.
#
# Four entry points, two jobs:
# - pull_request touching the image's own files: `smoke` builds for amd64 and actually runs the
#   container — readiness, sign-in, the healthcheck, the unprivileged user, a graceful stop and a
#   restart onto the same data root. It builds the PR's own checkout, so it proves the Dockerfile
#   against the code the PR carries.
# - push to main: `publish` builds that commit and moves `latest`, alongside an immutable
#   `main-<sha7>` twin. Every push, no path filter — `latest` follows main.
# - workflow_call from release.yml's `docker` job: the same build at the tag, published as
#   `X.Y.Z`, `X.Y` and `stable`.
# - workflow_dispatch for a manual re-publish, mirroring release.yml's own dispatch input.
name: Docker

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0); the image is built from that tag's source"
        required: true
        type: string
      push:
        description: "Push to Docker Hub (false builds without publishing)"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0); the image is built from that tag's source"
        required: true
        type: string
      push:
        description: "Push to Docker Hub (false builds without publishing)"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: hiyouga/penguinharness

jobs:
  # Build once and put the container through the contract the docs promise. Only amd64: this
  # job exists to catch a broken Dockerfile in minutes, and the arm64 leg of a publish build
  # compiles node-pty under QEMU.
  smoke:
    name: Build and run (amd64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: penguin-harness:pr
          build-args: |
            PENGUIN_VERSION=pr
            PENGUIN_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nothing about the image is root-only, so the entrypoint's privilege drop is observable
      # from a one-off run: `id -u` goes through the same entrypoint the server does.
      - name: Entrypoint drops to uid 1000
        run: |
          uid="$(docker run --rm penguin-harness:pr id -u)"
          echo "entrypoint ran the command as uid $uid"
          [ "$uid" = "1000" ]

      - name: Start the container
        run: |
          docker run -d --name penguin -p 127.0.0.1:7364:7364 \
            -e PENGUIN_SEED_ADMIN_PASSWORD=ci-password-123 \
            -v penguin-data:/data \
            penguin-harness:pr

      - name: Wait for the server
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:7364/api/install > /tmp/install.json; then
              jq -e '.installId | type == "string" and (. | length) > 0' /tmp/install.json
              exit 0
            fi
            sleep 1
          done
          echo "error: the server did not answer /api/install within 90s" >&2
          docker logs penguin >&2
          exit 1

      # The pinned seed password suppresses the first-login notice, so a successful login is
      # what proves the seed ran; /api/version then proves the session cookie is usable.
      - name: Sign in and read the version
        run: |
          code="$(curl -s -o /tmp/login.json -w '%{http_code}' -c /tmp/cookies.txt \
            -H 'content-type: application/json' \
            -d '{"userId":"admin","password":"ci-password-123"}' \
            http://127.0.0.1:7364/api/auth/login)"
          if [ "$code" != "200" ]; then
            echo "error: login answered $code" >&2
            cat /tmp/login.json >&2
            exit 1
          fi
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:7364/api/version > /tmp/version.json
          jq -e '.version | type == "string"' /tmp/version.json

      # web.db was created by the server itself, so its owner is the euid the server runs as.
      - name: Data root belongs to the unprivileged user
        run: |
          owners="$(docker exec penguin stat -c '%n %u:%g' /data /data/web.db)"
          echo "$owners"
          [ "$(docker exec penguin stat -c %u /data)" = "1000" ]
          [ "$(docker exec penguin stat -c %u /data/web.db)" = "1000" ]

      - name: HEALTHCHECK reports healthy
        run: |
          for _ in $(seq 1 90); do
            status="$(docker inspect -f '{{.State.Health.Status}}' penguin)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 1
          done
          echo "error: healthcheck ended in '$status'" >&2
          docker inspect -f '{{json .State.Health}}' penguin >&2
          exit 1

      # tini forwards SIGTERM to `penguin server`, which forwards it to the service child; the
      # service interrupts running Tasks, waits for them to wrap up and closes the database.
      # An idle server has nothing to drain, so this is a matter of a second, not the grace period.
      - name: Stops gracefully
        run: |
          start="$(date +%s)"
          docker stop -t 30 penguin
          elapsed="$(( $(date +%s) - start ))"
          code="$(docker inspect -f '{{.State.ExitCode}}' penguin)"
          echo "stopped in ${elapsed}s with exit code $code"
          [ "$code" = "0" ]
          [ "$elapsed" -lt 15 ]

      # The lock left behind by the stopped process must not refuse the next start, and the
      # data root must come back with its user intact rather than being seeded a second time.
      - name: Restarts onto the same data root
        run: |
          docker start penguin
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:7364/api/install > /dev/null; then break; fi
            sleep 1
          done
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"userId":"admin","password":"ci-password-123"}' \
            http://127.0.0.1:7364/api/auth/login)"
          if [ "$code" != "200" ]; then
            echo "error: login after restart answered $code" >&2
            docker logs penguin >&2
            exit 1
          fi

      - name: Container log
        if: always()
        run: docker logs penguin || true

  publish:
    name: Build and push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A release build must come from the TAG's source, not from whatever branch the run was
      # started on: `inputs.tag` is set for workflow_call and workflow_dispatch and empty for a
      # push to main, where the default ref is already the commit to build.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || '' }}

      # Two tag policies.
      #
      # A push to main publishes `latest` plus an immutable `main-<sha7>` twin, so `latest` always
      # names the newest build and anyone who needs to pin one can.
      #
      # A release publishes the exact version, `X.Y` for a plain X.Y.Z tag (a prerelease has no
      # meaningful minor line to move), and `stable` — resolved in the next step — for readers who
      # want releases only. The commit comes from the checkout rather than from github.sha, which
      # on a dispatch names the branch the run was started on and not the tag.
      - name: Resolve the version and its tags
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
        run: |
          COMMIT="$(git rev-parse HEAD)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ]; then
            echo "version=main-$(printf '%s' "$COMMIT" | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "minor=" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V="${TAG#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "latest=false" >> "$GITHUB_OUTPUT"
          if printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "minor=" >> "$GITHUB_OUTPUT"
            echo "$TAG is not a plain X.Y.Z tag; publishing the exact version only."
          fi

      # `stable` moves only when the tag is GitHub's current latest Release, so re-publishing an
      # older tag cannot demote the newest release image.
      - name: Determine whether the tag is the latest Release
        id: stable
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          LATEST_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$TAG" = "$LATEST_TAG" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "$TAG will be published without moving :stable (current latest: $LATEST_TAG)."
          fi

      # arm64 is emulated: the image is built on one x64 runner, and only the stage that compiles
      # node-pty runs under QEMU on that leg — the workspace build itself stays on the build
      # platform (see the Dockerfile).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Docker Hub is the default registry, so the login needs no `registry:`. It reads two
      # repository secrets: DOCKERHUB_USERNAME, and DOCKERHUB_TOKEN — a Docker Hub access token
      # with read/write scope on that repository.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.minor != '' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
            type=raw,value=stable,enable=${{ steps.stable.outputs.update == 'true' }}

      # provenance is off: the attestation manifest it attaches shows up in the package listing as
      # an "unknown/unknown" platform, which is worse for a reader than the attestation is worth.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PENGUIN_VERSION=${{ steps.version.outputs.version }}
            PENGUIN_COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

name: Check RFCs

on:
  pull_request:
    paths:
      - "rfcs/**"

jobs:
  check-rfcs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check RFC files
        run: |
          set -e
          ERROR=0

          echo "=== Checking RFC naming and numbering ==="

          # Check that all RFC files follow the naming convention
          for file in rfcs/PRFC-*.md; do
            if [ ! -e "$file" ]; then
              continue
            fi

            filename=$(basename "$file")
            
            # Check naming format: PRFC-NNNN-slug.md
            if ! echo "$filename" | grep -qE '^PRFC-[0-9]{4}-[a-z0-9-]+(\.zh)?\.md$'; then
              echo "❌ $filename does not follow naming convention PRFC-NNNN-slug.md"
              ERROR=1
            else
              echo "✅ $filename: naming OK"
            fi
          done

          echo ""
          echo "=== Checking RFC number sequence ==="

          # Extract all RFC numbers and check for duplicates
          RFC_NUMBERS=$(ls rfcs/PRFC-*.md 2>/dev/null | grep -v '\.zh\.md$' | sed 's/.*PRFC-\([0-9]*\)-.*/\1/' | sort)

          # Check for duplicate numbers (excluding known dual-0005)
          DUPLICATES=$(echo "$RFC_NUMBERS" | uniq -d | grep -v '^0005$' || true)
          if [ -n "$DUPLICATES" ]; then
            echo "❌ Found duplicate RFC numbers: $DUPLICATES"
            ERROR=1
          else
            echo "✅ No unexpected duplicate RFC numbers"
          fi

          echo ""
          echo "=== Checking required sections in RFCs ==="

          # Check that each RFC has required sections
          REQUIRED_SECTIONS=(
            "## Summary"
            "## Motivation"
            "## Reference-level explanation"
          )

          for file in rfcs/PRFC-*.md; do
            if [ ! -e "$file" ]; then
              continue
            fi

            # Skip README files
            if [[ "$file" =~ README ]]; then
              continue
            fi

            # The Chinese pair carries translated headings; the English file is the one checked
            if [[ "$file" == *.zh.md ]]; then
              continue
            fi

            filename=$(basename "$file")
            MISSING=()

            for section in "${REQUIRED_SECTIONS[@]}"; do
              if ! grep -q "^$section" "$file"; then
                MISSING+=("$section")
              fi
            done

            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "❌ $filename missing sections: ${MISSING[*]}"
              ERROR=1
            else
              echo "✅ $filename: all required sections present"
            fi
          done

          echo ""
          echo "=== Checking SemVer 2.0 version format in RFCs ==="

          SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          for file in rfcs/PRFC-*.md; do
            if [ ! -e "$file" ]; then
              continue
            fi

            filename=$(basename "$file")
            FILE_SEMVER_OK=1

            # If a Rev / 修订 provenance line is present, validate its version token
            REV_LINE=$(grep -E '^>[[:space:]]*(-\s*)?(\*\*Rev\*\*:|Rev:|\*\*修订\*\*：|修订：)' "$file" | head -n 1 || true)
            if [ -n "$REV_LINE" ]; then
              REV_TOKEN=$(echo "$REV_LINE" | sed -E 's/^>[[:space:]]*(-\s*)?(\*\*Rev\*\*:|Rev:|\*\*修订\*\*：|修订：)[[:space:]]*([^[:space:]（(;；,，]+).*/\3/')
              if ! echo "$REV_TOKEN" | grep -qE "$SEMVER_RE" || echo "$REV_TOKEN" | grep -qE '^v0\.0\.0($|[+-])'; then
                echo "❌ $filename has invalid Rev version '$REV_TOKEN' (must follow SemVer 2.0, e.g. v0.0.1, v0.1.0, v1.0.0)"
                ERROR=1
                FILE_SEMVER_OK=0
              fi
            fi

            # Every RFC must have ## Changes with SemVer 2.0 ### vX.Y.Z headings
            if ! grep -q "^## Changes" "$file"; then
              echo "❌ $filename is missing '## Changes' section"
              ERROR=1
              continue
            fi

            CHANGE_HEADINGS=$(awk '/^## Changes/{flag=1; next} /^## /{flag=0} flag && /^### /{sub(/^### +/, ""); print}' "$file")
            if [ -z "$CHANGE_HEADINGS" ]; then
              echo "❌ $filename has '## Changes' but no '### vX.Y.Z' version headings"
              ERROR=1
              continue
            fi

            while IFS= read -r ver; do
              [ -z "$ver" ] && continue
              if ! echo "$ver" | grep -qE "$SEMVER_RE" || echo "$ver" | grep -qE '^v0\.0\.0($|[+-])'; then
                echo "❌ $filename has invalid Changes version '### $ver' (must follow SemVer 2.0, e.g. v0.0.1, v0.1.0, v1.0.0)"
                ERROR=1
                FILE_SEMVER_OK=0
              fi
            done <<< "$CHANGE_HEADINGS"

            if [ $FILE_SEMVER_OK -eq 1 ]; then
              echo "✅ $filename: SemVer 2.0 versions OK"
            fi
          done

          echo ""
          echo "=== Checking Changes section for modified RFCs ==="

          # Get list of modified RFC files (excluding new files)
          MODIFIED_RFCS=$(git diff --name-status origin/main...HEAD | grep -E '^M\s+rfcs/PRFC-' | grep -v '\.zh\.md$' | awk '{print $2}' || true)

          if [ -n "$MODIFIED_RFCS" ]; then
            for file in $MODIFIED_RFCS; do
              filename=$(basename "$file")

              # Check if ## Changes section exists
              if ! grep -q "^## Changes" "$file"; then
                echo "❌ $filename was modified but has no '## Changes' section"
                echo "   When modifying a landed RFC, add a ## Changes section with version history"
                ERROR=1
                continue
              fi

              # Check if there's a valid SemVer 2.0 version heading under ## Changes
              CHANGE_VERSIONS=$(awk '/^## Changes[[:space:]]*$/{flag=1; next} /^## /{flag=0} flag && /^### /{sub(/^### +/, ""); sub(/[[:space:]]+$/, ""); print}' "$file")
              if [ -z "$CHANGE_VERSIONS" ]; then
                echo "❌ $filename has ## Changes section but no version headings (e.g., ### v1.0.0)"
                ERROR=1
                continue
              fi

              # If the document header declares a Rev version, ensure ## Changes records it
              REV_LINE=$(grep -E '^>[[:space:]]*(-\s*)?(\*\*Rev\*\*:|Rev:|\*\*修订\*\*：|修订：)' "$file" | head -n 1 || true)
              if [ -n "$REV_LINE" ]; then
                REV_TOKEN=$(echo "$REV_LINE" | sed -E 's/^>[[:space:]]*(-\s*)?(\*\*Rev\*\*:|Rev:|\*\*修订\*\*：|修订：)[[:space:]]*([^[:space:]（(;；,，]+).*/\3/')
                if ! echo "$CHANGE_VERSIONS" | grep -Fxq "$REV_TOKEN"; then
                  echo "❌ $filename declares Rev '$REV_TOKEN' but has no matching '### $REV_TOKEN' in ## Changes"
                  ERROR=1
                  continue
                fi
              fi

              echo "✅ $filename: ## Changes section present with version"
            done
          else
            echo "ℹ️  No modified RFC files detected (only new additions)"
          fi

          echo ""
          if [ $ERROR -eq 0 ]; then
            echo "✅ All RFC checks passed!"
          else
            echo "❌ RFC checks failed. Please fix the issues above."
            echo ""
            echo "Guidelines:"
            echo "- RFC files must be named PRFC-NNNN-slug.md, or PRFC-NNNN-slug.zh.md for its Chinese pair (4-digit number, lowercase kebab-case slug)"
            echo "- Required sections: Summary, Motivation, Reference-level explanation"
            echo "- When modifying a landed RFC, increment the version and add a ## Changes section"
            echo "- See rfcs/TEMPLATE.md for the full RFC template"
            exit 1
          fi

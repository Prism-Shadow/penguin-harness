name: Verify Windows data location on a native runner
on: workflow_dispatch
permissions:
  contents: read
jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Exercise the inbox Windows PowerShell migration helper
        shell: powershell
        run: ./packages/desktop/test/windows-data-location.ps1

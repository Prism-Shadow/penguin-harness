# Runtime desktop app: an unpacked Electron shell that boots the server and
# WAITS for hot-reload requests.
#
# Unlike desktop-build.yml (which produces signed installers for a release),
# this produces the "runtime" form from the four-layer model: a self-contained
# desktop app whose server comes up with the hot platform API on standby, ready
# to receive a platform push (scripts/watch-push-platform.mjs, an agent via the
# hot-skill-authoring SKILL, or a downloaded platform.tar.gz). It is built with
# electron-builder's `--dir` target — an unpacked app directory including the
# Electron runtime, not an installer — because a runtime is meant to be dropped
# in and hot-updated, not distributed through an installer channel.
#
# The platform units are the existing packages (server = backend platform,
# web = frontend platform); this artifact bakes a copy of both in so it works
# out of the box, and its running platform is replaceable over /api/hot —
# today that hot-swappable surface is the platform tree (the server package's
# hot export), growing as more of the package's services move under it.
#
# workflow_dispatch runs it standalone on any branch; workflow_call lets other
# workflows produce the runtime artifact as part of a larger pipeline.
name: Runtime desktop app

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional Git ref to check out."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out."
        required: false
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: "--linux"
          - os: macos-latest
            platform: "--mac"
          - os: windows-latest
            platform: "--win"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}

      # pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` IS "build the runtime": workspace build + the staged
      # self-contained app tree (packages/desktop/stage/app).
      - run: pnpm build

      # Unpacked runtime app only (no installer): electron-builder injects the
      # Electron runtime into stage/out/<platform>-unpacked. Unsigned — a
      # runtime is an internal/dev distribution form, not a store artifact.
      - name: Build unpacked runtime
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --dir packages/desktop exec electron-builder ${{ matrix.platform }} --dir --publish never

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: penguin-runtime-${{ runner.os }}
          if-no-files-found: error
          # Each OS produces exactly one of these unpacked trees.
          path: |
            packages/desktop/stage/out/linux-unpacked
            packages/desktop/stage/out/win-unpacked
            packages/desktop/stage/out/mac
            packages/desktop/stage/out/mac-arm64
            packages/desktop/stage/out/mac-x64

name: Windows Bento rendering experiment
on:
  push:
    branches: [test/windows-bento-browser-review]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        bento: [original, fixed]
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PENGUIN_BUILD_JS_ONLY: "1"
      CI: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out the file preview candidate
        if: matrix.bento == 'fixed'
        shell: bash
        run: |
          git fetch origin refs/pull/1720/head
          git diff 7d7071744...97b8d996d --name-only -z > "$RUNNER_TEMP/bento-paths"
          git restore --worktree --source=97b8d996d --pathspec-from-file="$RUNNER_TEMP/bento-paths" --pathspec-file-nul
      - id: setup
        uses: ./.github/actions/setup
        with:
          build: "@prismshadow/penguin-server...,@prismshadow/penguin-web...,@prismshadow/penguin-desktop..."
          alongside: pnpm --filter @prismshadow/penguin-web exec playwright install chromium
      - name: Native Windows installation and rendering
        shell: bash
        run: |
          node -p 'JSON.stringify({ platform:process.platform, arch:process.arch, node:process.version })'
          git config --get core.autocrlf || true
          SKIP_BUILD=1 bash packages/web/e2e/run.sh windows-bento-large-preview.spec.mjs --grep "the browser previews"
      - name: Directory preview routing and retry
        if: matrix.bento == 'fixed'
        shell: bash
        run: SKIP_BUILD=1 bash packages/web/e2e/run.sh files-folders.spec.mjs --grep "directory renders full HTML"
      - name: Keep browser evidence
        if: always()
        shell: bash
        run: cp -R packages/web/test-results "$RUNNER_TEMP/web-results" || true
      - name: Native Electron BrowserWindow and embedded server
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        env:
          BENTO_DESKTOP: "1"
        run: |
          cd packages/desktop
          node scripts/preflight.mjs || exit 1
          cd ../web
          pnpm exec playwright test -c e2e/playwright.config.mjs windows-bento-large-preview.spec.mjs --grep "source desktop"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bento-rendering-${{ matrix.bento }}
          path: |
            packages/web/test-results/
            ${{ runner.temp }}/web-results/
          retention-days: 7

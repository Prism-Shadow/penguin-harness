name: "Bug report / 缺陷报告"
description: "Something in PenguinHarness does not do what it says it does. / PenguinHarness 的某项功能没有按说明工作。"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search the [open issues](https://github.com/Prism-Shadow/penguin-harness/issues) first, and check whether the [newest release](https://github.com/Prism-Shadow/penguin-harness/releases) already fixes it.
        请先搜索[已有的 issue](https://github.com/Prism-Shadow/penguin-harness/issues)，并确认[最新版本](https://github.com/Prism-Shadow/penguin-harness/releases)是否已经修复。

        **Never paste credentials**: API keys, bot tokens, `system_config.yaml`, `.env`, or a whole Trace or log. Quote only the lines that matter. A security problem goes to the [security policy](https://github.com/Prism-Shadow/penguin-harness/blob/main/.github/SECURITY.md), not here.
        **不要粘贴任何凭据**：API Key、机器人 Token、`system_config.yaml`、`.env`，以及完整的 Trace 或日志，只引用相关的几行。安全问题请按[安全策略](https://github.com/Prism-Shadow/penguin-harness/blob/main/.github/SECURITY.md)私下报告，不要发在这里。

  - type: textarea
    id: summary
    attributes:
      label: What happened / 问题描述
      description: |
        What you did, what you expected, and what happened instead.
        你做了什么，期望得到什么，实际发生了什么。
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: System info / 系统信息
      description: |
        The version, how PenguinHarness is installed (desktop app, CLI, server or source checkout), and the OS. The version is in the output of `penguin version`, or in Settings.
        版本、安装方式（桌面端、CLI、服务端或源码）与操作系统。版本可从 `penguin version` 的输出或设置页查到。
      placeholder: |
        Version: v0.2.18
        Installed as: Desktop app
        OS: macOS 15.4 (arm64)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: |
        The shortest sequence that shows the problem. Saying whether it also happens on a fresh data root (`PENGUIN_HOME=/tmp/penguin-check penguin ...`) helps tell a code defect from state an earlier version left behind.
        能复现问题的最短步骤。说明在全新的数据根目录（`PENGUIN_HOME=/tmp/penguin-check penguin ...`）上是否同样出现，有助于区分代码缺陷与旧版本遗留的状态。
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Error output / 报错信息
      description: |
        Error messages, or the failing part of a log. Take out keys and tokens first.
        报错信息，或日志中出错的部分。粘贴前请去掉密钥与 Token。
      render: text
    validations:
      required: false

  - type: textarea
    id: others
    attributes:
      label: Others / 其他
      description: |
        Anything else that helps: a screenshot, the Agent, model or approval mode in play.
        其他有助于定位的信息：截图，以及所用的 Agent、模型或审批模式。
    validations:
      required: false
